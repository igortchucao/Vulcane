<html lang="pt-BR">
<head>

<title>Sua proposta · Vulcane</title>

<style>
:root{
  --bg:#0b0a0f;--bg-2:#14121a;--card:#1c1922;--line:#2a2632;
  --ink:#f4f1ec;--muted:#9a94a3;--accent:#ff5a1f;--accent-2:#ff7d3c;--gold:#ffc24d;
  --sg:'Space Grotesk',system-ui,sans-serif;--inter:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--inter);line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
.eyebrow{font-size:.78rem;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:600;font-family:var(--sg)}
h1,h2,h3{font-family:var(--sg);line-height:1.12;font-weight:800;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;gap:9px;background:var(--accent);color:#160a04;padding:15px 26px;border-radius:11px;font-family:var(--sg);font-weight:700;font-size:.95rem;border:none;cursor:pointer;transition:.2s}
.btn:hover{background:var(--accent-2);transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn svg{width:19px;height:19px;fill:currentColor}

header{border-bottom:1px solid var(--line);background:rgba(13,15,20,.82);backdrop-filter:blur(12px);position:sticky;top:0;z-index:40}
.nav{display:flex;align-items:center;justify-content:space-between;height:62px}
.logo{font-family:var(--sg);font-weight:700;font-size:1.3rem;letter-spacing:-.02em;display:flex;align-items:center}
.logo .logo-v{height:.92em;width:.78em;margin-right:-.02em}
.logo .p{color:var(--accent)}
.badge-conf{font-size:.72rem;color:var(--muted);border:1px solid var(--line);padding:6px 12px;border-radius:100px;display:flex;align-items:center;gap:6px}
.badge-conf svg{width:13px;height:13px;stroke:var(--accent);fill:none;stroke-width:2}

/* ---------- tela bloqueada ---------- */
.locked{min-height:82vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 22px}
.locked-card{max-width:440px}
.locked .ic{width:74px;height:74px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
.locked .ic svg{width:34px;height:34px;stroke:var(--accent);fill:none;stroke-width:1.6}
.locked h1{font-size:1.7rem;margin-bottom:12px}
.locked p{color:var(--muted);margin-bottom:26px}

/* ---------- hero proposta ---------- */
.p-hero{padding:60px 0 40px;text-align:center;position:relative;overflow:hidden}
.p-hero::before{content:"";position:absolute;top:-40%;left:50%;transform:translateX(-50%);width:760px;height:760px;background:radial-gradient(circle,rgba(255,90,31,.13),transparent 62%);pointer-events:none}
.p-hero .in{position:relative}
.p-hero .tag{display:inline-block;background:var(--card);border:1px solid var(--line);padding:7px 16px;border-radius:100px;font-size:.82rem;color:var(--muted);margin-bottom:22px}
.p-hero h1{font-size:clamp(2rem,5.4vw,3.4rem);margin-bottom:16px}
.p-hero h1 span{color:var(--accent)}
.p-hero p{color:var(--muted);font-size:1.1rem;max-width:600px;margin:0 auto 28px}
.p-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ---------- preview navegador ---------- */
.preview{padding:20px 0 70px}
.dev-toggle{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.dev-toggle button{background:var(--card);border:1px solid var(--line);color:var(--muted);padding:10px 20px;border-radius:10px;font-family:var(--sg);font-weight:500;font-size:.84rem;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.dev-toggle button:hover{border-color:var(--accent);color:var(--ink)}
.dev-toggle button.on{background:var(--accent);color:#160a04;border-color:var(--accent);font-weight:700}
.dev-toggle svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.browser{max-width:960px;margin:0 auto;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);box-shadow:0 30px 80px -40px rgba(0,0,0,.8);transition:max-width .4s cubic-bezier(.4,0,.2,1)}
.browser-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg-2)}
.browser-bar .dots{display:flex;gap:6px}
.browser-bar .dots i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.browser-bar .url{margin-left:12px;flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:.8rem;color:var(--muted);font-family:var(--inter)}
.browser-bar .live{font-size:.7rem;color:var(--accent);display:flex;align-items:center;gap:5px}
.browser-bar .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(255,90,31,.2)}
.browser iframe{width:100%;height:620px;border:0;display:block;background:#fff}
.preview-note{text-align:center;color:var(--muted);font-size:.85rem;margin-top:16px}

/* versões comemorativas */
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px}
.theme-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.tc-bar{display:flex;align-items:center;gap:6px;padding:9px 12px;background:var(--bg-2);border-bottom:1px solid var(--line)}
.tc-bar i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.tc-bar .u{margin-left:8px;font-size:.7rem;color:var(--muted)}
.tc-shot{padding:26px 18px;min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;overflow:hidden}
.tc-deco{position:absolute;font-size:1.5rem}
.tc-shot h4{font-family:var(--sg);font-size:1.5rem;color:#fff;margin-bottom:6px;text-shadow:2px 2px 0 rgba(0,0,0,.4)}
.tc-shot .sub{font-size:.82rem}
.tc-chips{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.tc-chips span{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:.72rem;padding:5px 11px;border-radius:100px;font-weight:600}
.tc-label{padding:12px 16px;font-family:var(--sg);font-size:.98rem;display:flex;align-items:center;gap:8px}
.tc-label .tag{margin-left:auto;font-size:.66rem;color:var(--muted);font-family:var(--inter);text-transform:uppercase;letter-spacing:.1em}
.hw .tc-shot{background:radial-gradient(circle at 50% 130%,#ff7a18,#3a1550 62%,#160a24)}
.hw .tc-shot .sub{color:#f6cfa2}
.xm .tc-shot{background:radial-gradient(circle at 50% 130%,#1f8f4d,#8f1717 66%,#3d0a0a)}
.xm .tc-shot .sub{color:#ffd9d0}
@media(max-width:700px){.theme-grid{grid-template-columns:1fr}}

/* sistema de gestão + status */
.sys-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:26px;align-items:center;margin-top:6px}
.sys-panel{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sp-top{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);font-family:var(--sg);font-weight:600;font-size:.88rem}
.sp-top .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;margin-left:auto;box-shadow:0 0 0 3px rgba(74,222,128,.2)}
.sp-order{padding:15px 18px;border-bottom:1px solid var(--line)}
.spo-head{display:flex;justify-content:space-between;font-weight:600;font-size:.92rem;margin-bottom:4px}
.spo-head .v{color:var(--accent)}
.spo-items{color:var(--muted);font-size:.8rem;margin-bottom:11px}
.steps{display:flex;gap:5px;margin-bottom:12px}
.step{flex:1;text-align:center;font-size:.6rem;padding:6px 3px;border-radius:6px;background:var(--bg-2);color:var(--muted);border:1px solid var(--line)}
.step.done{background:rgba(255,90,31,.14);color:var(--accent);border-color:rgba(255,90,31,.5)}
.step.now{background:var(--accent);color:#160a04;border-color:var(--accent);font-weight:700}
.spo-btn{background:var(--accent);border:none;color:#160a04;padding:9px 15px;border-radius:8px;font-family:var(--sg);font-weight:600;font-size:.78rem}
.phone{max-width:265px;margin:0 auto;border:9px solid #1b1b1f;border-radius:34px;overflow:hidden;box-shadow:0 24px 55px -22px rgba(0,0,0,.75);background:#0b141a}
.ph-top{background:#202c33;display:flex;align-items:center;gap:9px;padding:11px 13px}
.ph-top .av{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--sg);font-weight:700;font-size:.9rem;color:#160a04}
.ph-top b{font-size:.84rem;color:#e9edef}
.ph-top small{display:block;font-size:.64rem;color:#8696a0}
.ph-chat{padding:16px 12px;display:flex;flex-direction:column;gap:9px;min-height:330px;background:#0b141a}
.bub{max-width:88%;background:#202c33;color:#e9edef;padding:9px 12px;border-radius:10px;border-top-left-radius:2px;font-size:.79rem;line-height:1.45;align-self:flex-start}
.bub b{color:#fff}
.bub time{display:block;font-size:.56rem;color:#8696a0;text-align:right;margin-top:3px}
@media(max-width:700px){.sys-grid{grid-template-columns:1fr}}

/* ---------- seções ---------- */
.section{padding:64px 0}
.section.alt{background:var(--bg-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec-head{text-align:center;max-width:640px;margin:0 auto 44px}
.sec-head h2{font-size:clamp(1.8rem,4.2vw,2.7rem);margin:12px 0 12px}
.sec-head p{color:var(--muted);font-size:1.05rem}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.icard{display:flex;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.icard .ic{width:46px;height:46px;border-radius:12px;background:rgba(255,90,31,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icard .ic svg{width:23px;height:23px;stroke:var(--accent);fill:none;stroke-width:1.7}
.icard h3{font-size:1.08rem;margin-bottom:5px}
.icard p{color:var(--muted);font-size:.93rem}

/* roi */
.roi-hl{text-align:center;background:linear-gradient(160deg,rgba(255,90,31,.12),transparent);border:1px solid var(--line);border-radius:18px;padding:34px 22px;max-width:640px;margin:0 auto}
.roi-hl b{display:block;font-family:var(--sg);font-size:clamp(2rem,5.4vw,2.9rem);font-weight:800;color:var(--accent);margin-bottom:6px}
.roi-hl span{color:var(--muted);font-size:1.05rem}

/* cta final */
.final{text-align:center;padding:80px 0}
.final h2{font-size:clamp(1.9rem,4.6vw,3rem);margin-bottom:16px}
.final p{color:var(--muted);font-size:1.12rem;max-width:540px;margin:0 auto 30px}

footer{border-top:1px solid var(--line);padding:30px 0;text-align:center;color:var(--muted);font-size:.84rem}
footer b{color:var(--ink);font-family:var(--sg)}

.wa-float{position:fixed;right:20px;bottom:20px;z-index:60;width:58px;height:58px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px -6px rgba(37,211,102,.5);transition:.2s}
.wa-float:hover{transform:scale(1.08)}
.wa-float svg{width:31px;height:31px;fill:#fff}

@media(max-width:820px){
  .cards{grid-template-columns:1fr}
  .browser iframe{height:520px}
  .section{padding:48px 0}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

</svg>

<header>
  <div class="wrap nav">

  </div>
</header>

<main id="app"><!-- preenchido via JS --></main>

<script>
// ================== CLIENTES ==================
// Para adicionar um novo cliente, copie um bloco e mude o código da URL.
// O link fica: .../prototipo.html?cliente=CODIGO
const CLIENTES = {
  "reformaluh170726": {
    cliente: "Loja Reforma",
    contato: "Luana",
    previewUrl: "/clientes/reforma/",   // caminho da prévia dentro do site
    tag: "Prévia preparada especialmente para a Loja Reforma",

    mudancas: [
      {ic:"img", t:"Carrossel de banners", d:"Topo do site com você e as campanhas em destaque, com troca automática."},

  "chiliburguer200726": {

    mudancas: [
      {ic:"star", t:"Site com nome de vocês", d:"chiliburguer.com.br em vez de um subdomínio de terceiros."},
      {ic:"chart", t:"Aparecer no Google", d:"Quem busca “hambúrguer em Divinópolis” encontra vocês."},
      {ic:"img", t:"Cardápio que dá fome", d:"Suas fotos em destaque, do jeito que merecem."},
      {ic:"cam", t:"Carrinho de pedido", d:"O cliente monta o pedido e envia pronto no WhatsApp."},
      {ic:"phone", t:"Feito pro celular", d:"É de lá que 9 em cada 10 pedidos chegam."},

    ],
    vantagens: [

      {ic:"bolt", t:"Pedido sem fricção", d:"Menos etapas até o cliente fechar o pedido."},
      {ic:"heart", t:"Sem mexer no que funciona", d:"O sistema de pedidos atual continua como está."},
    ],
    roiTop: "Um endereço que é seu",

    whats: "5537998652824",
    whatsMsg: "Oi Igor! Vi a prévia do site da Chili Burguer e quero conversar."

const ICONS = {
  img:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/>',
  grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  cam:'<rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13" r="4"/><path d="M8 7l1.5-3h5L16 7"/>',

};
const svg = k => `<svg viewBox="0 0 24 24">${ICONS[k]||''}</svg>`;
const waLink = (n,m) => `https://wa.me/${n}?text=${encodeURIComponent(m)}`;

function render(){
  const code = new URLSearchParams(location.search).get('cliente');
  const c = code && CLIENTES[code.toLowerCase()];
  const app = document.getElementById('app');
  if(!c){ location.replace('index.html'); return; }
  const wa = waLink(c.whats, c.whatsMsg);
  const sistema = c.sistema ? `
    <section class="section"><div class="wrap">
      <div class="sec-head"><span class="eyebrow">Muito além de um cardápio</span><h2>Painel de gestão + status no WhatsApp</h2><p>Vocês controlam os pedidos num painel simples, e o cliente acompanha tudo pelo zap — sem depender de app de terceiros.</p></div>

          </div>

            <div class="spo-head"><span>#129 · Marina</span><span class="v">R$ 42,00</span></div>
            <div class="spo-items">1x El Cabron · 1x Batata palito</div>
            <div class="steps"><div class="step done">Recebido</div><div class="step now">Aceito</div><div class="step">Em produção</div><div class="step">Saiu</div></div>
            <button class="spo-btn">Avançar → Em produção</button>
          </div>
        </div>
        <div class="phone">
          <div class="ph-top"><div class="av">C</div><div><b>Chili Burguer</b><small>online</small></div></div>
