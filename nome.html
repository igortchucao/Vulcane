<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Vulcane · logo final</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a0f;--card:#14121a;--line:#2a2632;--ink:#f4f1ec;--ash:#9a94a3;--ember:#ff5a1f;
--sg:'Space Grotesk',sans-serif;--i:'Inter',sans-serif}
*{margin:0;box-sizing:border-box}body{background:var(--bg);color:var(--ink);font-family:var(--i);padding:44px 20px;text-align:center}
h1{font-family:var(--sg);font-weight:700;font-size:1.5rem;margin-bottom:6px}
.sub{color:var(--ash);margin-bottom:38px;font-size:.95rem}
.stage{max-width:760px;margin:0 auto 16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:46px 28px;position:relative}
.stage.win{border-color:var(--ember);box-shadow:0 0 60px -26px var(--ember)}
.lbl{position:absolute;top:16px;left:22px;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ash);font-family:var(--sg)}
.lbl.g{color:var(--ember)}
.wm{font-family:var(--sg);font-weight:700;letter-spacing:-.02em;line-height:1;display:inline-flex;align-items:center}
.wm .vk{height:.92em;width:.78em;margin-right:-.02em}
.wm .t{color:var(--ink)}
.wm .p{color:var(--ember)}
.big{font-size:4.4rem}.mid{font-size:2.2rem}.sm{font-size:1.2rem}
.row{display:flex;gap:40px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:12px}
.chip{background:#fff;padding:16px 24px;border-radius:12px}
.chip .wm .t{color:#14121a}
.note{color:var(--ash);font-size:.84rem;max-width:460px;margin:10px auto 0}
</style></head><body>

<h1>Vulcane · logo oficial</h1>
<p class="sub">O V forjado (com a faísca em brasa) é a letra "V" do nome.</p>

<svg width="0" height="0" style="position:absolute"><symbol id="vk" viewBox="0 0 100 100">
  <path d="M11 6 L31 6 L50 50 L72 6 L86 6 L56 66 L44 66 Z" fill="var(--c,#ff5a1f)"/>
  <circle cx="50" cy="84" r="10" fill="var(--c,#ff5a1f)"/>
</symbol></svg>

<div class="stage win">
  <span class="lbl g">Logo principal</span>
  <span class="wm big"><svg class="vk"><use href="#vk"/></svg><span class="t">ulcane</span><span class="p">.</span></span>
</div>

<div class="stage">
  <span class="lbl">Testes de tamanho</span>
  <div class="row">
    <span class="wm mid"><svg class="vk"><use href="#vk"/></svg><span class="t">ulcane</span><span class="p">.</span></span>
    <span class="wm sm"><svg class="vk"><use href="#vk"/></svg><span class="t">ulcane</span><span class="p">.</span></span>
  </div>
</div>

<div class="stage">
  <span class="lbl">Fundo claro · ícone (favicon)</span>
  <div class="row">
    <span class="chip"><span class="wm mid"><svg class="vk" style="--c:#c8201a"><use href="#vk"/></svg><span class="t">ulcane</span><span class="p" style="color:#c8201a">.</span></span></span>
    <span style="width:70px;height:70px;border-radius:16px;background:var(--ember);display:inline-flex;align-items:center;justify-content:center"><svg style="height:44px;width:44px;--c:#160a04"><use href="#vk"/></svg></span>
    <span style="width:70px;height:70px;border-radius:16px;background:#1c1922;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center"><svg style="height:44px;width:44px"><use href="#vk"/></svg></span>
  </div>
</div>
<p class="note">O V sozinho vira o favicon / foto de perfil.</p>

</body></html>
